name: Actualizar resultados V2

on:
  workflow_dispatch:

  schedule:
    # Cada 20 minutos entre 11:00 a.m. y 11:40 p.m. hora Colombia (UTC-5)
    # GitHub Actions usa UTC:
    # 16:00-23:40 UTC = 11:00 a.m.-6:40 p.m. Colombia
    # 00:00-04:40 UTC = 7:00 p.m.-11:40 p.m. Colombia
    - cron: "0,20,40 16-23 * * *"
    - cron: "0,20,40 0-4 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-resultados-v2
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar antes
        run: git pull --rebase origin main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar actualización ESPN
        run: python actualizar_resultados.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add resultados.json index.html

          if git diff --cached --quiet; then
            echo "No hay cambios en resultados.json ni index.html"
            exit 0
          fi

          git commit -m "Actualizar resultados automáticamente"
          git push origin main
